    <script>
    const audio = document.getElementById('audio-track');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const trackCover = document.getElementById('track-cover');

    // Fungsi utama Play / Pause dengan penanganan Error
    playBtn.addEventListener('click', () => {
        if (audio.paused) {
            // Memulai putar musik
            audio.play()
                .then(() => {
                    // Jika berhasil diputar
                    playIcon.classList.remove('fa-play');
                    playIcon.classList.add('fa-pause');
                    trackCover.classList.add('rotating');
                })
                .catch((error) => {
                    // Jika gagal (Misal: diblokir browser atau link rusak)
                    console.error("Gagal memutar audio:", error);
                    alert("Akses audio diblokir browser atau file tidak ditemukan! Coba klik di mana saja pada layar dulu baru tekan Play, atau gunakan file mp3 lokal.");
                });
        } else {
            // Menghentikan musik
            audio.pause();
            playIcon.classList.remove('fa-pause');
            playIcon.classList.add('fa-play');
            trackCover.classList.remove('rotating');
        }
    });

    // Update Progress Bar Berjalan
    audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
            const progressPercent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = `${progressPercent}%`;
        }
    });

    // Klik pada Progress Bar untuk Lompat Durasi
    progressContainer.addEventListener('click', (e) => {
        const width = progressContainer.clientWidth;
        const clickX = e.offsetX;
        if (audio.duration) {
            audio.currentTime = (clickX / width) * audio.duration;
        }
    });

    // Reset tombol saat lagu selesai
    audio.addEventListener('ended', () => {
        playIcon.classList.remove('fa-pause');
        playIcon.classList.add('fa-play');
        trackCover.classList.remove('rotating');
        progressBar.style.width = '0%';
    });
</script>
